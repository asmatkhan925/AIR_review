<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">Figure 2 draft SVG</title>
  <desc id="fig2-desc">Six interacting taxonomy layers for low-resource ASR in the foundation-model era.</desc>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#55616b" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .note { fill: #f8fafc; stroke: #4b5563; stroke-width: 1.8; }
      .box1 { fill: #eef5fb; stroke: #4b5563; stroke-width: 1.8; }
      .box2 { fill: #edf7f1; stroke: #4b5563; stroke-width: 1.8; }
      .box3 { fill: #fff5e8; stroke: #4b5563; stroke-width: 1.8; }
      .box4 { fill: #fceff0; stroke: #4b5563; stroke-width: 1.8; }
      .box5 { fill: #f1f5ff; stroke: #4b5563; stroke-width: 1.8; }
      .box6 { fill: #eef9ef; stroke: #4b5563; stroke-width: 1.8; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #1f2937; }
      .panel { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #1f2937; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #1f2937; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #4b5563; }
      .arrow { stroke: #55616b; stroke-width: 2.1; fill: none; marker-end: url(#arrow2); }
      .feedback { stroke: #55616b; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow2); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" />

  <rect class="note" x="170" y="34" width="1060" height="58" rx="22" />
  <text class="small" x="700" y="69" text-anchor="middle">Foundation-model-era specific: stronger pretrained starting points, but reliability depends on cross-layer alignment</text>

  <rect class="box1" x="65" y="120" width="570" height="170" rx="18" />
  <text class="panel" x="95" y="150">Resource</text>
  <text class="body" x="95" y="187">labeled speech; unlabeled speech; weak labels; pseudo-labels</text>
  <text class="body" x="95" y="210">multilingual corpora; multimodal resources</text>

  <rect class="box2" x="65" y="350" width="570" height="170" rx="18" />
  <text class="panel" x="95" y="380">Language</text>
  <text class="body" x="95" y="417">dialect; accent; orthography; script</text>
  <text class="body" x="95" y="440">morphology; code-switching; language-family mismatch</text>

  <rect class="box3" x="65" y="580" width="570" height="170" rx="18" />
  <text class="panel" x="95" y="610">Model</text>
  <text class="body" x="95" y="647">hybrid ASR; end-to-end ASR; SSL encoders</text>
  <text class="body" x="95" y="670">multilingual SSL; weakly supervised ASR; SpeechLMs; multimodal systems</text>

  <rect class="box4" x="765" y="120" width="570" height="170" rx="18" />
  <text class="panel" x="795" y="150">Adaptation</text>
  <text class="body" x="795" y="187">full fine-tuning; continued pretraining; adapters</text>
  <text class="body" x="795" y="210">LoRA/QLoRA; related-language transfer; contextual biasing; forgetting control</text>

  <rect class="box5" x="765" y="350" width="570" height="170" rx="18" />
  <text class="panel" x="795" y="380">Supervision</text>
  <text class="body" x="795" y="417">supervised labels; self-supervision; self-training</text>
  <text class="body" x="795" y="440">confidence filtering; uncertainty filtering; single-teacher KD; multi-teacher KD</text>

  <rect class="box6" x="765" y="580" width="570" height="170" rx="18" />
  <text class="panel" x="795" y="610">Evaluation</text>
  <text class="body" x="795" y="647">WER/CER; orthography-aware scoring; language/dialect/domain breakdowns</text>
  <text class="body" x="795" y="670">robustness; fairness; compute; reproducibility; hallucination checks</text>

  <line class="arrow" x1="635" y1="205" x2="765" y2="455" />
  <line class="arrow" x1="635" y1="435" x2="765" y2="685" />
  <line class="arrow" x1="635" y1="665" x2="765" y2="205" />
  <line class="arrow" x1="1040" y1="290" x2="1040" y2="350" />
  <line class="arrow" x1="1040" y1="520" x2="1040" y2="580" />
  <path class="feedback" d="M 765 685 C 520 830, 230 820, 180 470 C 150 270, 245 205, 635 205" />

  <text class="small" x="700" y="828" text-anchor="middle">The taxonomy is layer-based, not a method list; the detailed evidence remains in Block G and the section drafts.</text>
</svg>
