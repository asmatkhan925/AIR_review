<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="fig3-title fig3-desc">
  <title id="fig3-title">Cross-block evidence flow</title>
  <desc id="fig3-desc">Three dominant columns show evidence moving from resource and language conditions through model, adaptation, and supervision decisions to evaluation, robustness, and future agenda feedback.</desc>
  <defs>
    <marker id="arrow3" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#45515c" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .region { fill: #f8fafc; stroke: #1f2937; stroke-width: 2.2; }
      .left { fill: #eef5fb; stroke: #34495e; stroke-width: 2; }
      .middle { fill: #edf7f1; stroke: #34495e; stroke-width: 2; }
      .right { fill: #fff4e5; stroke: #34495e; stroke-width: 2; }
      .agenda { fill: #fceff0; stroke: #34495e; stroke-width: 2; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #111827; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #1f2937; }
      .feedbackText { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #374151; }
      .arrow { stroke: #45515c; stroke-width: 3; fill: none; marker-end: url(#arrow3); }
      .feedback { stroke: #45515c; stroke-width: 2.4; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrow3); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" />

  <rect class="region" x="55" y="70" width="380" height="690" rx="22" />
  <rect class="region" x="510" y="70" width="380" height="690" rx="22" />
  <rect class="region" x="965" y="70" width="380" height="690" rx="22" />

  <text class="heading" x="245" y="112" text-anchor="middle">Resource and language</text>
  <text class="heading" x="700" y="112" text-anchor="middle">Model and supervision</text>
  <text class="heading" x="1155" y="112" text-anchor="middle">Evaluation and agenda</text>

  <rect class="left" x="88" y="150" width="314" height="132" rx="18" />
  <text class="label" x="118" y="185">Resource condition</text>
  <text class="body" x="118" y="220">labeled, unlabeled, weak-label</text>
  <text class="body" x="118" y="246">multilingual, multimodal</text>

  <rect class="left" x="88" y="350" width="314" height="132" rx="18" />
  <text class="label" x="118" y="385">Language condition</text>
  <text class="body" x="118" y="420">dialect, orthography, script</text>
  <text class="body" x="118" y="446">morphology, code-switching</text>

  <rect class="left" x="88" y="550" width="314" height="132" rx="18" />
  <text class="label" x="118" y="585">Documentation controls</text>
  <text class="body" x="118" y="620">metadata, licensing, validation</text>
  <text class="body" x="118" y="646">normalization and scoring policy</text>

  <rect class="middle" x="543" y="150" width="314" height="132" rx="18" />
  <text class="label" x="573" y="185">Model family</text>
  <text class="body" x="573" y="220">SSL, multilingual SSL</text>
  <text class="body" x="573" y="246">weakly supervised, multimodal</text>

  <rect class="middle" x="543" y="350" width="314" height="132" rx="18" />
  <text class="label" x="573" y="385">Adaptation path</text>
  <text class="body" x="573" y="420">fine-tuning, PEFT, transfer</text>
  <text class="body" x="573" y="446">compute and forgetting controls</text>

  <rect class="middle" x="543" y="550" width="314" height="132" rx="18" />
  <text class="label" x="573" y="585">Supervision path</text>
  <text class="body" x="573" y="620">human labels, self-supervision</text>
  <text class="body" x="573" y="646">pseudo-labeling, KD, agreement</text>

  <rect class="right" x="998" y="150" width="314" height="132" rx="18" />
  <text class="label" x="1028" y="185">Evaluation protocol</text>
  <text class="body" x="1028" y="220">WER/CER plus breakdowns</text>
  <text class="body" x="1028" y="246">normalization and compute checks</text>

  <rect class="right" x="998" y="350" width="314" height="132" rx="18" />
  <text class="label" x="1028" y="385">Robustness evidence</text>
  <text class="body" x="1028" y="420">noise, channel, dialect, domain</text>
  <text class="body" x="1028" y="446">modality and unsupported content</text>

  <rect class="agenda" x="998" y="550" width="314" height="132" rx="18" />
  <text class="label" x="1028" y="585">Future agenda</text>
  <text class="body" x="1028" y="620">definitions and benchmarks</text>
  <text class="body" x="1028" y="646">adaptation, supervision, deployment</text>

  <path class="arrow" d="M 402 216 C 448 216, 496 216, 543 216" />
  <path class="arrow" d="M 402 416 C 448 416, 496 416, 543 416" />
  <path class="arrow" d="M 402 616 C 448 616, 496 616, 543 616" />

  <path class="arrow" d="M 857 216 C 904 216, 952 216, 998 216" />
  <path class="arrow" d="M 857 416 C 904 416, 952 416, 998 416" />
  <path class="arrow" d="M 857 616 C 904 616, 952 616, 998 616" />

  <path class="feedback" d="M 1155 682 C 1155 812, 245 812, 245 682" />
  <text class="feedbackText" x="700" y="806" text-anchor="middle">evaluation and agenda feedback</text>

  <path class="feedback" d="M 998 416 C 925 520, 900 616, 857 616" />
</svg>
