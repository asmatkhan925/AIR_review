<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">Foundation-model-era low-resource ASR bottleneck stack</title>
  <desc id="fig1-desc">A neutral foundation speech model starting point sits above eight interacting low-resource ASR bottleneck layers, with side feedback loops from evaluation and deployment back to resources and adaptation.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#45515c" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .model { fill: #f3f4f6; stroke: #1f2937; stroke-width: 2.4; }
      .modelAccent { fill: #e8eef7; stroke: #1f2937; stroke-width: 2.4; }
      .layerA { fill: #eef5fb; stroke: #34495e; stroke-width: 2; }
      .layerB { fill: #edf7f1; stroke: #34495e; stroke-width: 2; }
      .layerC { fill: #fff4e5; stroke: #34495e; stroke-width: 2; }
      .layerD { fill: #fceff0; stroke: #34495e; stroke-width: 2; }
      .modelText { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #111827; }
      .modelSub { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 600; fill: #374151; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #1f2937; }
      .sideLabel { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #374151; }
      .arrow { stroke: #45515c; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #45515c; stroke-width: 2.4; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" />

  <rect class="model" x="330" y="34" width="740" height="94" rx="22" />
  <rect class="modelAccent" x="355" y="58" width="690" height="46" rx="14" />
  <text class="modelText" x="700" y="88" text-anchor="middle">Foundation speech models</text>
  <text class="modelSub" x="700" y="119" text-anchor="middle">stronger starting point, not a complete solution</text>

  <path class="arrow" d="M 700 128 L 700 155" />

  <rect class="layerA" x="190" y="156" width="1020" height="68" rx="16" />
  <text class="label" x="226" y="184">Resource quality and documentation</text>
  <text class="body" x="226" y="209">labeled speech, unlabeled speech, weak labels, metadata, licensing, validation</text>

  <path class="arrow" d="M 700 224 L 700 243" />

  <rect class="layerB" x="190" y="244" width="1020" height="68" rx="16" />
  <text class="label" x="226" y="272">Language fit</text>
  <text class="body" x="226" y="297">dialect, accent, orthography, script, morphology, code-switching</text>

  <path class="arrow" d="M 700 312 L 700 331" />

  <rect class="layerC" x="190" y="332" width="1020" height="68" rx="16" />
  <text class="label" x="226" y="360">Adaptation choice</text>
  <text class="body" x="226" y="385">full fine-tuning, continued pretraining, PEFT, transfer, bounded prompting</text>

  <path class="arrow" d="M 700 400 L 700 419" />

  <rect class="layerD" x="190" y="420" width="1020" height="68" rx="16" />
  <text class="label" x="226" y="448">Supervision reliability</text>
  <text class="body" x="226" y="473">pseudo-label quality, confidence, uncertainty, teacher agreement, KD objective</text>

  <path class="arrow" d="M 700 488 L 700 507" />

  <rect class="layerA" x="190" y="508" width="1020" height="68" rx="16" />
  <text class="label" x="226" y="536">Evaluation and comparability</text>
  <text class="body" x="226" y="561">WER/CER, language-wise, dialect-wise, domain-wise, normalization-aware scoring</text>

  <path class="arrow" d="M 700 576 L 700 595" />

  <rect class="layerB" x="190" y="596" width="1020" height="68" rx="16" />
  <text class="label" x="226" y="624">Robustness and deployment</text>
  <text class="body" x="226" y="649">noise, far-field speech, channel shift, speaker variation, fairness, reproducibility</text>

  <path class="arrow" d="M 700 664 L 700 683" />

  <rect class="layerC" x="190" y="684" width="1020" height="68" rx="16" />
  <text class="label" x="226" y="712">Compute and reporting</text>
  <text class="body" x="226" y="737">hardware, trainable parameters, inference cost, model version, decoding scripts</text>

  <path class="arrow" d="M 700 752 L 700 771" />

  <rect class="layerD" x="190" y="772" width="1020" height="68" rx="16" />
  <text class="label" x="226" y="800">Multimodal and LLM risks/safeguards</text>
  <text class="body" x="226" y="825">AVSR mismatch, hallucination, over-correction, context leakage, grounding</text>

  <path class="feedback" d="M 188 806 C 90 760, 90 214, 188 190" />
  <text class="sideLabel" x="84" y="506" transform="rotate(-90 84 506)" text-anchor="middle">resource feedback</text>

  <path class="feedback" d="M 1212 806 C 1308 760, 1308 432, 1212 454" />
  <text class="sideLabel" x="1316" y="620" transform="rotate(90 1316 620)" text-anchor="middle">evaluation feedback</text>
</svg>
