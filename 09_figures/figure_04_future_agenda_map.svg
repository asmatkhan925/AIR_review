<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="fig4-title fig4-desc">
  <title id="fig4-title">Future agenda map for reliable low-resource ASR</title>
  <desc id="fig4-desc">A readable agenda map places reliable low-resource ASR in the center and connects nine bounded research-priority clusters to it.</desc>
  <defs>
    <marker id="arrow4" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#45515c" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .center { fill: #f8fafc; stroke: #1f2937; stroke-width: 2.6; }
      .cluster1 { fill: #eef5fb; stroke: #34495e; stroke-width: 2; }
      .cluster2 { fill: #edf7f1; stroke: #34495e; stroke-width: 2; }
      .cluster3 { fill: #fff4e5; stroke: #34495e; stroke-width: 2; }
      .cluster4 { fill: #fceff0; stroke: #34495e; stroke-width: 2; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .centerText { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #111827; }
      .centerSub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 600; fill: #374151; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 14.5px; fill: #1f2937; }
      .gap { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #374151; }
      .link { stroke: #45515c; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" />

  <path class="link" d="M 425 142 C 520 210, 600 330, 635 372" />
  <path class="link" d="M 700 162 C 700 244, 700 305, 700 354" />
  <path class="link" d="M 975 142 C 880 210, 800 330, 765 372" />
  <path class="link" d="M 995 353 C 920 376, 872 405, 878 430" />
  <path class="link" d="M 995 613 C 920 590, 872 522, 878 470" />
  <path class="link" d="M 700 738 C 700 645, 700 590, 700 546" />
  <path class="link" d="M 522 664 C 600 625, 644 573, 668 544" />
  <path class="link" d="M 425 613 C 505 590, 528 522, 522 470" />
  <path class="link" d="M 405 353 C 480 376, 528 405, 522 430" />

  <ellipse class="center" cx="700" cy="450" rx="178" ry="96" />
  <text class="centerText" x="700" y="437" text-anchor="middle">Reliable</text>
  <text class="centerText" x="700" y="471" text-anchor="middle">low-resource ASR</text>
  <text class="centerSub" x="700" y="502" text-anchor="middle">bounded future agenda</text>

  <rect class="cluster1" x="70" y="58" width="355" height="116" rx="18" />
  <text class="label" x="96" y="89">Definitions and resources</text>
  <text class="body" x="96" y="118">labeled, unlabeled, weak-label</text>
  <text class="body" x="96" y="141">validation, metadata, compute</text>
  <text class="gap" x="96" y="164">GAP-G1 / GAP-G2</text>

  <rect class="cluster2" x="522" y="46" width="355" height="116" rx="18" />
  <text class="label" x="548" y="77">Documentation and metadata</text>
  <text class="body" x="548" y="106">provenance, consent, licensing</text>
  <text class="body" x="548" y="129">dialect/accent metadata, validation</text>
  <text class="gap" x="548" y="152">GAP-G2 / GAP-G12</text>

  <rect class="cluster3" x="975" y="58" width="355" height="116" rx="18" />
  <text class="label" x="1001" y="89">Orthography and dialect tests</text>
  <text class="body" x="1001" y="118">raw and normalized scoring</text>
  <text class="body" x="1001" y="141">dialect and domain breakdowns</text>
  <text class="gap" x="1001" y="164">GAP-G3 / GAP-G4</text>

  <rect class="cluster4" x="995" y="292" width="345" height="122" rx="18" />
  <text class="label" x="1021" y="324">Compute-aware adaptation</text>
  <text class="body" x="1021" y="354">matched comparisons and memory</text>
  <text class="body" x="1021" y="377">trainable parameters, forgetting</text>
  <text class="gap" x="1021" y="400">GAP-G5 / GAP-G6 / GAP-G12</text>

  <rect class="cluster1" x="995" y="552" width="345" height="122" rx="18" />
  <text class="label" x="1021" y="584">Reliable pseudo-labeling and KD</text>
  <text class="body" x="1021" y="614">teacher quality and uncertainty</text>
  <text class="body" x="1021" y="637">agreement, filtering, calibration</text>
  <text class="gap" x="1021" y="660">GAP-G7 / GAP-G8</text>

  <rect class="cluster2" x="522" y="738" width="355" height="116" rx="18" />
  <text class="label" x="548" y="769">Evaluation and robustness</text>
  <text class="body" x="548" y="798">language, dialect, domain, noise</text>
  <text class="body" x="548" y="821">hallucination and reproducibility</text>
  <text class="gap" x="548" y="844">GAP-G4 / GAP-G9 / GAP-G12</text>

  <rect class="cluster3" x="70" y="552" width="355" height="122" rx="18" />
  <text class="label" x="96" y="584">AVSR and multimodal robustness</text>
  <text class="body" x="96" y="614">modality coverage and missing input</text>
  <text class="body" x="96" y="637">privacy and degraded audio tests</text>
  <text class="gap" x="96" y="660">GAP-G10</text>

  <rect class="cluster4" x="60" y="292" width="345" height="122" rx="18" />
  <text class="label" x="86" y="324">Constrained LLM assistance</text>
  <text class="body" x="86" y="354">N-best or lattice grounding</text>
  <text class="body" x="86" y="377">over-correction and leakage checks</text>
  <text class="gap" x="86" y="400">GAP-G9 / GAP-G11</text>

  <rect class="cluster1" x="522" y="616" width="355" height="96" rx="18" />
  <text class="label" x="548" y="648">Reproducibility and deployment</text>
  <text class="body" x="548" y="677">versions, splits, scripts, artifacts</text>
  <text class="gap" x="548" y="699">compute and deployment cost</text>

</svg>
